services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: uiip
      POSTGRES_USER: uiip
      POSTGRES_PASSWORD: ${UIIP_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uiip -d uiip"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - uiip-postgres:/var/lib/postgresql/data
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      UIIP_DATABASE_BACKEND: postgresql
      UIIP_DATABASE_URL: postgresql://uiip:${UIIP_POSTGRES_PASSWORD}@postgres:5432/uiip
      UIIP_HTTP_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  uiip-postgres:
