name: Metals Native Platform Health V1 Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Resolve latest successful Metals production run
        id: metals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh run list --workflow "Metals Production Cycle" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Metals Production Cycle run found."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download latest Metals production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p _metals_artifact
          gh run download "${{ steps.metals.outputs.run_id }}" \
            -n "metals-production-${{ steps.metals.outputs.run_id }}" \
            -D _metals_artifact
      - name: Build and certify native platform health V1 sidecar
        run: >-
          python scripts/build_metals_native_platform_health_sidecar.py
          --freshness _metals_artifact/operations/metals/native_freshness_v1/metals_data_freshness.csv
          --freshness-manifest _metals_artifact/operations/metals/native_freshness_v1/manifest.json
          --native-cycle _metals_artifact/operations/metals/native_cycle/latest.json
          --history-manifest _metals_artifact/operations/metals/native_rich_history/manifest.json
          --contract config/presentation/metals_platform_health_v1.json
          --output-root data/operations/metals/native_platform_health_v1_rehearsal
      - name: Assert rehearsal remains publication-safe
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/operations/metals/native_platform_health_v1_rehearsal/manifest.json')
          m = json.loads(p.read_text())
          assert m['postgres_write_performed'] is False
          assert m['publication_staged'] is False
          assert m['publication_activated'] is False
          assert m['source_collection_performed'] is False
          assert m['legacy_equivalent'] is False
          assert m['row_count'] == 1
          assert all(m['evidence_gates'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metals-native-platform-health-v1-${{ github.run_id }}
          path: data/operations/metals/native_platform_health_v1_rehearsal/
          retention-days: 30
