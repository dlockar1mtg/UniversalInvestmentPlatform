name: UIP Production Publication Cycle

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "7 17 * * *" # backup: skipped unless a source has newer data than the last publication (see the gate job)
    - cron: "7 20 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_REHEARSED_RICH_CANDIDATE to authorize a manual publication cycle
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uip-production-publication-cycle
  cancel-in-progress: false

jobs:
  gate:
    # GitHub often starts scheduled runs hours late or skips them, so the publication also has
    # backup schedule times. A scheduled run goes ahead when a governed source (or the Crypto v2
    # prices) has finished a newer run than the last successful publication, or when nothing has
    # been published for 20 hours. Manual runs always go ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          UIP_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.UIP_SOURCE_ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          api() {
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $1" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$2"
          }
          # Start time of the newest successful run that did real work (a job other than the gate succeeded).
          last_worked() {
            local token="$1" repo="$2" workflow="$3" runs id started worked
            runs="$(api "$token" "https://api.github.com/repos/$repo/actions/workflows/$workflow/runs?per_page=50" |
              jq -r --argjson self "$GITHUB_RUN_ID" '.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success") | select(.id != $self) | select(.event == "schedule" or .event == "workflow_dispatch") | "\(.id) \(.run_started_at)"')"
            while read -r id started; do
              [ -n "$id" ] || continue
              worked="$(api "$token" "https://api.github.com/repos/$repo/actions/runs/$id/jobs?per_page=100" | jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
              if [ "$worked" -gt 0 ]; then echo "$started"; return 0; fi
            done <<< "$runs"
            echo ""
          }
          published="$(last_worked "$UIP_TOKEN" "$GITHUB_REPOSITORY" production-publication-cycle.yml)"
          echo "Last successful publication started: ${published:-never}"
          stale="$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          if [ -z "$published" ] || [[ "$published" < "$stale" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          while read -r token_name repo workflow; do
            token="$UIP_TOKEN"; [ "$token_name" = "source" ] && token="$SOURCE_TOKEN"
            newest="$(last_worked "$token" "$repo" "$workflow")" || newest=""   # an unreadable source never stops the gate
            echo "$repo/$workflow newest successful run: ${newest:-none}"
            if [ -n "$newest" ] && [[ "$newest" > "$published" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done <<'SOURCES'
          source dlockar1mtg/CryptoIntelligencePlatform crypto-production-cycle.yml
          uip dlockar1mtg/UniversalInvestmentPlatform metals-production-cycle.yml
          source dlockar1mtg/mtg-investment-terminal mtg-marketplace-production.yml
          uip dlockar1mtg/UniversalInvestmentPlatform crypto-v2-prices.yml
          source dlockar1mtg/StocksETFIntelligencePlatform etf-hosted-market-data.yml
          source dlockar1mtg/HousingIntelligencePlatform housing-production.yml
          source dlockar1mtg/MacroIntelligencePlatform macro-production.yml
          SOURCES
          echo "No source has a newer run than the last publication, so this backup run stops here."
          echo "run=false" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }} # a failed gate never blocks the run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      UIIP_DATABASE_URL: ${{ secrets.UIIP_DATABASE_URL }}
      SOURCE_TOKEN: ${{ secrets.UIP_SOURCE_ARTIFACTS_TOKEN }}
      UIIP_AUTOMATED_PUBLICATION: "1"
      UIP_MTG_SECRET_LAIR_V2_ENABLED: "1"   # Secret Lair v2: research records (#239) + model decisions beside the certified authority (#244)
      UIP_MTG_PRECOLLECTOR_V2_ENABLED: "1"   # Pre-Collector v2 price tiers (#255) with its list and research pages
      UIP_CRYPTO_V2_ENABLED: "1"   # Crypto v2: valuation regime, Monte Carlo projections (#259) and pages (#260)
      UIP_MTG_COLLECTOR_V2_ENABLED: "1" # Collector v2: tested quarter returns (mtg #97), decisions and pages (#263)
    steps:
      - name: Checkout UIP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install UIP dependencies
        run: pip install -r requirements.txt -r requirements/phase_7_3.txt

      - name: Validate publication authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          exec 2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)
          test -n "$UIIP_DATABASE_URL" || { echo "UIIP_DATABASE_URL is missing" >&2; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo "UIP_SOURCE_ARTIFACTS_TOKEN is missing" >&2; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "PUBLISH_REHEARSED_RICH_CANDIDATE" || {
              echo "Exact manual publication confirmation token was not provided" >&2
              exit 1
            }
          elif [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "Unauthorized publication event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

      - name: Resolve current governed source runs
        id: sources
        shell: bash
        env:
          UIP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec 2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)

          api_get() {
            local token="$1"
            local url="$2"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          resolve_source() {
            local key="$1"
            local repo="$2"
            local workflow="$3"
            local artifact_prefix="$4"
            local token="$5"

            local runs_json run_json status conclusion event head_sha run_id started_at
            runs_json="$(api_get "$token" "https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?per_page=50")"
            printf '%s' "$runs_json" |
              jq -r --arg key "$key" --arg path ".github/workflows/${workflow}" '[.workflow_runs[] | select(.head_branch == "main") | select(.event != "push") | select(.path == $path)] | sort_by(.run_started_at // .created_at) | reverse | .[0:3][] | "RUN_CANDIDATE domain=\($key) run=\(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "") started_at=\(.run_started_at // .created_at)"' || true
            # Backup schedule runs that found the day's work already done skip every job but the
            # gate and carry no artifact, so pass over them to the newest run that did the work.
            run_json=""
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_id="$(printf '%s' "$candidate" | jq -r '.id')"
              # A source run still queued or in progress has published nothing yet (GitHub often
              # starts schedules hours late), so use the newest finished run; the 30-hour limit
              # below still refuses anything stale, and a failed finished run still stops the cycle.
              if [ "$(printf '%s' "$candidate" | jq -r '.status')" != "completed" ]; then
                echo "SKIPPED_RUNNING_RUN domain=${key} run=${candidate_id} status=$(printf '%s' "$candidate" | jq -r '.status')"
                continue
              fi
              if [ "$(printf '%s' "$candidate" | jq -r '.status + "/" + (.conclusion // "")')" = "completed/success" ]; then
                worked="$(api_get "$token" "https://api.github.com/repos/${repo}/actions/runs/${candidate_id}/jobs?per_page=100" | jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
                if [ "$worked" = "0" ]; then
                  echo "SKIPPED_BACKUP_RUN domain=${key} run=${candidate_id}"
                  continue
                fi
              fi
              run_json="$candidate"
              break
            done < <(
              printf '%s' "$runs_json" |
                jq -c --arg path ".github/workflows/${workflow}" '
                  [
                    .workflow_runs[]
                    | select(.head_branch == "main") | select(.event != "push")
                    | select(.path == $path)
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                  ]
                  | sort_by(.run_started_at // .created_at)
                  | reverse
                  | .[0:10][]
                '
            )
            test -n "$run_json" || {
              echo "No governed source run found for ${repo}/${workflow}" >&2
              exit 1
            }

            status="$(printf '%s' "$run_json" | jq -r '.status')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
            event="$(printf '%s' "$run_json" | jq -r '.event')"
            head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
            run_id="$(printf '%s' "$run_json" | jq -r '.id')"
            started_at="$(printf '%s' "$run_json" | jq -r '.run_started_at // .created_at')"

            echo "SOURCE_CANDIDATE domain=${key} repo=${repo} workflow=${workflow} run=${run_id} event=${event} status=${status} conclusion=${conclusion} started_at=${started_at}"

            test "$status" = "completed" || {
              echo "Latest governed source run is not complete: ${repo}/${run_id} status=${status}" >&2
              exit 1
            }
            test "$conclusion" = "success" || {
              echo "Latest governed source run failed: ${repo}/${run_id} conclusion=${conclusion}" >&2
              exit 1
            }

            python -c 'import sys; from datetime import datetime, timezone; started=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); age_hours=(datetime.now(timezone.utc)-started.astimezone(timezone.utc)).total_seconds()/3600; (_ for _ in ()).throw(SystemExit(f"Governed source run {sys.argv[2]} is too old: {age_hours:.1f} hours")) if age_hours > 30 else None' "$started_at" "${repo}/${run_id}"

            local artifacts_json artifact_json artifact_id artifact_name artifact_digest
            artifacts_json="$(api_get "$token" "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_json="$(printf '%s' "$artifacts_json" | jq -c --arg prefix "$artifact_prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))][0] // empty')"
            test -n "$artifact_json" || {
              echo "No current source artifact found for ${repo}/${run_id}/${artifact_prefix}" >&2
              exit 1
            }
            artifact_id="$(printf '%s' "$artifact_json" | jq -r '.id')"
            artifact_name="$(printf '%s' "$artifact_json" | jq -r '.name')"
            artifact_digest="$(printf '%s' "$artifact_json" | jq -r '.digest // ""')"

            {
              echo "${key}_repo=${repo}"
              echo "${key}_workflow=${workflow}"
              echo "${key}_run_id=${run_id}"
              echo "${key}_head_sha=${head_sha}"
              echo "${key}_event=${event}"
              echo "${key}_artifact_id=${artifact_id}"
              echo "${key}_artifact_name=${artifact_name}"
              echo "${key}_artifact_digest=${artifact_digest}"
            } >> "$GITHUB_OUTPUT"

            echo "CURRENT_SOURCE domain=${key} repo=${repo} run=${run_id} head=${head_sha} artifact=${artifact_name}"
          }

          resolve_source \
            crypto \
            "dlockar1mtg/CryptoIntelligencePlatform" \
            "crypto-production-cycle.yml" \
            "crypto-production-" \
            "$SOURCE_TOKEN"

          resolve_source \
            metals \
            "dlockar1mtg/UniversalInvestmentPlatform" \
            "metals-production-cycle.yml" \
            "metals-production-" \
            "$UIP_TOKEN"

          resolve_source \
            mtg \
            "dlockar1mtg/mtg-investment-terminal" \
            "mtg-marketplace-production.yml" \
            "mtg-marketplace-production-" \
            "$SOURCE_TOKEN"

      - name: Checkout current governed MTG authority
        uses: actions/checkout@v4
        with:
          repository: dlockar1mtg/mtg-investment-terminal
          ref: ${{ steps.sources.outputs.mtg_head_sha }}
          token: ${{ secrets.UIP_SOURCE_ARTIFACTS_TOKEN }}
          path: source_repos/mtg
          persist-credentials: false

      - name: Verify resolved MTG authority
        shell: bash
        run: |
          set -euo pipefail
          exec 2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)
          observed_mtg_head="$(git -C source_repos/mtg rev-parse HEAD)"
          test "$observed_mtg_head" = "${{ steps.sources.outputs.mtg_head_sha }}" || {
            echo "MTG authority head drifted: ${observed_mtg_head}" >&2
            exit 1
          }

      - name: Download current governed source artifacts
        shell: bash
        env:
          UIP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec 2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)
          mkdir -p incoming/crypto incoming/metals incoming/mtg

          api_get() {
            local token="$1"
            local url="$2"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          download_current() {
            local repo="$1"
            local artifact_id="$2"
            local expected_digest="$3"
            local token="$4"
            local destination="$5"

            api_get "$token" "https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip" > "${destination}.zip"

            if [ -n "$expected_digest" ] && [ "$expected_digest" != "null" ]; then
              case "$expected_digest" in
                sha256:*)
                  digest="${expected_digest#sha256:}"
                  echo "${digest}  ${destination}.zip" | sha256sum --check --status || {
                    echo "Artifact digest mismatch: ${repo}/${artifact_id}" >&2
                    exit 1
                  }
                  ;;
              esac
            fi

            unzip -q "${destination}.zip" -d "$destination"
          }

          download_current \
            "dlockar1mtg/CryptoIntelligencePlatform" \
            "${{ steps.sources.outputs.crypto_artifact_id }}" \
            "${{ steps.sources.outputs.crypto_artifact_digest }}" \
            "$SOURCE_TOKEN" \
            "incoming/crypto"

          download_current \
            "dlockar1mtg/mtg-investment-terminal" \
            "${{ steps.sources.outputs.mtg_artifact_id }}" \
            "${{ steps.sources.outputs.mtg_artifact_digest }}" \
            "$SOURCE_TOKEN" \
            "incoming/mtg"

          download_current \
            "dlockar1mtg/UniversalInvestmentPlatform" \
            "${{ steps.sources.outputs.metals_artifact_id }}" \
            "${{ steps.sources.outputs.metals_artifact_digest }}" \
            "$UIP_TOKEN" \
            "incoming/metals"

      - name: Fetch the provisional ETF package (optional; never blocks the certified domains)
        shell: bash
        run: |
          set -uo pipefail
          repo="dlockar1mtg/StocksETFIntelligencePlatform"
          api_get() {
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${SOURCE_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          fetch_etf() {
            local runs run_id started worked artifact artifact_id digest
            runs="$(api_get "https://api.github.com/repos/${repo}/actions/workflows/etf-hosted-market-data.yml/runs?per_page=30")" || return 1
            while read -r run_id started; do
              [ -n "$run_id" ] || continue
              worked="$(api_get "https://api.github.com/repos/${repo}/actions/runs/${run_id}/jobs?per_page=100" | jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')" || return 1
              [ "$worked" -gt 0 ] && break
              run_id=""
            done < <(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success") | select(.event == "schedule" or .event == "workflow_dispatch")] | sort_by(.run_started_at) | reverse | .[0:10][] | "\(.id) \(.run_started_at)"')
            [ -n "${run_id:-}" ] || { echo "No successful ETF market data run"; return 1; }
            python -c 'import sys; from datetime import datetime, timezone; s=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); sys.exit(0 if (datetime.now(timezone.utc)-s).total_seconds() <= 30*3600 else 1)' "$started" || { echo "Newest ETF run ${run_id} is over 30 hours old"; return 1; }
            artifact="$(api_get "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts?per_page=100" | jq -c '[.artifacts[] | select(.expired == false and (.name | startswith("etf-production-")))][0] // empty')" || return 1
            [ -n "$artifact" ] || { echo "ETF run ${run_id} has no etf-production artifact"; return 1; }
            artifact_id="$(printf '%s' "$artifact" | jq -r '.id')"; digest="$(printf '%s' "$artifact" | jq -r '.digest // ""')"
            api_get "https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip" > incoming/etf.zip || return 1
            case "$digest" in sha256:*) echo "${digest#sha256:}  incoming/etf.zip" | sha256sum --check --status || { echo "ETF artifact digest mismatch"; return 1; } ;; esac
            rm -rf incoming/etf && mkdir -p incoming/etf && unzip -q incoming/etf.zip -d incoming/etf || return 1
            python -m foundation.presentation.etf_package incoming/etf || return 1
            echo "CURRENT_SOURCE domain=etf repo=${repo} run=${run_id} artifact=$(printf '%s' "$artifact" | jq -r '.name')"
            echo "UIP_ETF_PACKAGE_DIR=${PWD}/incoming/etf" >> "$GITHUB_ENV"
            echo "UIP_ETF_SOURCE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          }
          if ! fetch_etf; then
            echo "::warning title=ETF package::Not published this cycle (see log above). The certified domains publish as usual."
          fi

      - name: Fetch the provisional housing package (optional, weekly; never blocks the certified domains)
        shell: bash
        run: |
          set -uo pipefail
          repo="dlockar1mtg/HousingIntelligencePlatform"
          api_get() {
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${SOURCE_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          fetch_housing() {
            local runs run_id started artifact artifact_id digest
            runs="$(api_get "https://api.github.com/repos/${repo}/actions/workflows/housing-production.yml/runs?per_page=30")" || return 1
            run_id=""
            while read -r candidate candidate_started; do
              [ -n "$candidate" ] || continue
              artifact="$(api_get "https://api.github.com/repos/${repo}/actions/runs/${candidate}/artifacts?per_page=100" | jq -c '[.artifacts[] | select(.expired == false and (.name | startswith("housing-production-")))][0] // empty')" || return 1
              if [ -n "$artifact" ]; then run_id="$candidate"; started="$candidate_started"; break; fi
            done < <(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success") | select(.event == "schedule" or .event == "workflow_dispatch")] | sort_by(.run_started_at) | reverse | .[0:10][] | "\(.id) \(.run_started_at)"')
            [ -n "$run_id" ] || { echo "No successful housing run with a package"; return 1; }
            python -c 'import sys; from datetime import datetime, timezone; s=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); sys.exit(0 if (datetime.now(timezone.utc)-s).total_seconds() <= 8*86400 else 1)' "$started" || { echo "Newest housing package ${run_id} is over 8 days old"; return 1; }
            artifact_id="$(printf '%s' "$artifact" | jq -r '.id')"; digest="$(printf '%s' "$artifact" | jq -r '.digest // ""')"
            api_get "https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip" > incoming/housing.zip || return 1
            case "$digest" in sha256:*) echo "${digest#sha256:}  incoming/housing.zip" | sha256sum --check --status || { echo "Housing artifact digest mismatch"; return 1; } ;; esac
            rm -rf incoming/housing && mkdir -p incoming/housing && unzip -q incoming/housing.zip -d incoming/housing || return 1
            python -m foundation.presentation.housing_package incoming/housing || return 1
            echo "CURRENT_SOURCE domain=housing repo=${repo} run=${run_id} artifact=$(printf '%s' "$artifact" | jq -r '.name')"
            echo "UIP_HOUSING_PACKAGE_DIR=${PWD}/incoming/housing" >> "$GITHUB_ENV"
            echo "UIP_HOUSING_SOURCE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          }
          mkdir -p incoming
          if ! fetch_housing; then
            echo "::warning title=Housing package::Not published this cycle (see log above). The certified domains publish as usual."
          fi

      - name: Fetch the provisional macro package (optional, daily; never blocks the certified domains)
        shell: bash
        run: |
          set -uo pipefail
          repo="dlockar1mtg/MacroIntelligencePlatform"
          api_get() {
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${SOURCE_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          fetch_macro() {
            local runs run_id started artifact artifact_id digest
            runs="$(api_get "https://api.github.com/repos/${repo}/actions/workflows/macro-production.yml/runs?per_page=30")" || return 1
            run_id=""
            while read -r candidate candidate_started; do
              [ -n "$candidate" ] || continue
              artifact="$(api_get "https://api.github.com/repos/${repo}/actions/runs/${candidate}/artifacts?per_page=100" | jq -c '[.artifacts[] | select(.expired == false and (.name | startswith("macro-production-")))][0] // empty')" || return 1
              if [ -n "$artifact" ]; then run_id="$candidate"; started="$candidate_started"; break; fi
            done < <(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success") | select(.event == "schedule" or .event == "workflow_dispatch")] | sort_by(.run_started_at) | reverse | .[0:10][] | "\(.id) \(.run_started_at)"')
            [ -n "$run_id" ] || { echo "No successful macro run with a package"; return 1; }
            python -c 'import sys; from datetime import datetime, timezone; s=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); sys.exit(0 if (datetime.now(timezone.utc)-s).total_seconds() <= 5*86400 else 1)' "$started" || { echo "Newest macro package ${run_id} is over 5 days old"; return 1; }
            artifact_id="$(printf '%s' "$artifact" | jq -r '.id')"; digest="$(printf '%s' "$artifact" | jq -r '.digest // ""')"
            api_get "https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip" > incoming/macro.zip || return 1
            case "$digest" in sha256:*) echo "${digest#sha256:}  incoming/macro.zip" | sha256sum --check --status || { echo "Macro artifact digest mismatch"; return 1; } ;; esac
            rm -rf incoming/macro && mkdir -p incoming/macro && unzip -q incoming/macro.zip -d incoming/macro || return 1
            python -m foundation.presentation.macro_package incoming/macro || return 1
            echo "CURRENT_SOURCE domain=macro repo=${repo} run=${run_id} artifact=$(printf '%s' "$artifact" | jq -r '.name')"
            echo "UIP_MACRO_PACKAGE_DIR=${PWD}/incoming/macro" >> "$GITHUB_ENV"
            echo "UIP_MACRO_SOURCE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          }
          mkdir -p incoming
          if ! fetch_macro; then
            echo "::warning title=Macro package::Not published this cycle (see log above). The certified domains publish as usual."
          fi

      - name: Re-certify current rich source contracts before any PostgreSQL connection
        run: >-
          python scripts/audit_rich_publication_source_contract.py
          --metals-artifact incoming/metals
          --mtg-repo source_repos/mtg
          --evidence-output data/operations/publication/rich_production_source_contract.json
          2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)

      - name: Publish current governed rich candidate atomically
        run: >-
          python scripts/publish_rehearsed_rich_candidate_v2.py
          --confirm PUBLISH_REHEARSED_RICH_CANDIDATE
          --crypto-artifact incoming/crypto
          --metals-artifact incoming/metals
          --mtg-artifact incoming/mtg
          --mtg-repo source_repos/mtg
          --expected-mtg-head "${{ steps.sources.outputs.mtg_head_sha }}"
          --crypto-source-run-id "${{ steps.sources.outputs.crypto_run_id }}"
          --metals-source-run-id "${{ steps.sources.outputs.metals_run_id }}"
          --mtg-source-run-id "${{ steps.sources.outputs.mtg_run_id }}"
          --evidence-output data/operations/publication/latest_rich_publication.json
          2> >(tee -a "$RUNNER_TEMP/publication_errors.log" >&2)

      - name: Upload rich publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uip-rich-production-publication-${{ github.run_id }}
          path: |
            data/operations/publication/rich_production_source_contract.json
            data/operations/publication/latest_rich_publication.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record publication outcome
        if: always()
        continue-on-error: true
        run: >-
          python scripts/record_publication_outcome.py
          --job-status "${{ job.status }}"
          --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --workflow "${{ github.workflow }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --error-log "${{ runner.temp }}/publication_errors.log"
