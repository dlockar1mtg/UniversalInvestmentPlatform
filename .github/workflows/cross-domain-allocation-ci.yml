name: Cross-Domain Allocation CI

on:
  pull_request:
    paths:
      - "foundation/intelligence/cross_domain/**"
      - "scripts/run_cross_domain_allocation.py"
      - "tests/intelligence/cross_domain/**"
      - ".github/workflows/cross-domain-allocation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-cross-domain-allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
          python -m pip check
      - name: Validate imports and tests
        run: |
          python -m compileall -q foundation scripts
          python - <<'PY'
          from foundation.intelligence.cross_domain import AllocationPolicy, allocate_capital
          print("Cross-domain allocation imports passed")
          PY
          python -m pytest tests/intelligence/cross_domain/test_cross_domain_allocator.py -q
