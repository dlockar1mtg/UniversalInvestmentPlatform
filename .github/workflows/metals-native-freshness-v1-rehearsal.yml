name: Metals Native Freshness V1 Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Resolve latest successful Metals production run
        id: metals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh run list --workflow "Metals Production Cycle" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Metals Production Cycle run found."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download latest Metals production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p _metals_artifact
          gh run download "${{ steps.metals.outputs.run_id }}" \
            -n "metals-production-${{ steps.metals.outputs.run_id }}" \
            -D _metals_artifact
      - name: Build and certify native freshness V1 sidecar
        run: >-
          python scripts/build_metals_native_freshness_sidecar.py
          --benchmark _metals_artifact/operations/metals/benchmark_input.csv
          --daily-market _metals_artifact/operations/metals/daily_market_input.csv
          --contract config/presentation/metals_data_freshness_v1.json
          --output-root data/operations/metals/native_freshness_v1_rehearsal
      - uses: actions/upload-artifact@v4
        with:
          name: metals-native-freshness-v1-${{ github.run_id }}
          path: data/operations/metals/native_freshness_v1_rehearsal/
          retention-days: 30
