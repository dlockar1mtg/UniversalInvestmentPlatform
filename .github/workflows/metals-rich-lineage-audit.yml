name: Metals Rich Lineage Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      UIIP_DATABASE_URL: ${{ secrets.UIIP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client dependency
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Validate required database secret
        run: python -c "import os; assert os.environ.get('UIIP_DATABASE_URL')"
      - name: Audit restored rich Metals lineage
        run: >-
          python scripts/audit_metals_rich_lineage.py
          --output data/operations/publication/metals_rich_lineage_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metals-rich-lineage-${{ github.run_id }}
          path: data/operations/publication/metals_rich_lineage_audit.json
          retention-days: 30
