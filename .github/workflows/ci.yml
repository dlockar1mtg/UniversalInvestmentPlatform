name: Universal Investment Platform CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "release/*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uip
          POSTGRES_PASSWORD: uip-ci-only
          POSTGRES_DB: uip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uip -d uip_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway database inside the job (not a secret): runs the Postgres-only tests, e.g. publication retention.
      UIIP_TEST_POSTGRES_DSN: postgresql://uip:uip-ci-only@localhost:5432/uip_test
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Display Python version
        run: python --version
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install platform and production dependencies
        run: pip install -r requirements.txt -r requirements/phase_7_3.txt
      - name: Set up Node.js for production JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate production JavaScript syntax
        run: |
          node --version
          for f in foundation/production/dashboard_assets/*.js; do node --check "$f" || exit 1; done
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Compile production source
        run: python -m compileall -q foundation scripts
