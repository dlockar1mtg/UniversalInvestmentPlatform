name: Universal Investment Platform CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "release/*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Display Python version
        run: python --version
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install platform and production dependencies
        run: pip install -r requirements.txt -r requirements/phase_7_3.txt
      - name: Set up Node.js for production JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate production JavaScript syntax
        run: |
          node --version
          node --check foundation/production/dashboard_assets/recommendation_ui.js
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Compile production source
        run: python -m compileall -q foundation scripts
