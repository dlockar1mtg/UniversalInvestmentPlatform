name: Rich Publication Contract Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rich-publication-contract-rehearsal
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SOURCE_TOKEN: ${{ secrets.UIP_SOURCE_ARTIFACTS_TOKEN }}
    steps:
      - name: Checkout UIP
        uses: actions/checkout@v4

      - name: Checkout certified MTG research authority
        uses: actions/checkout@v4
        with:
          repository: dlockar1mtg/mtg-investment-terminal
          ref: main
          token: ${{ secrets.UIP_SOURCE_ARTIFACTS_TOKEN }}
          path: source_repos/mtg
          persist-credentials: false

      - name: Validate source token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "UIP_SOURCE_ARTIFACTS_TOKEN is missing"; exit 1; }

      - name: Download latest successful Metals artifact
        shell: bash
        env:
          UIP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming/metals

          api_get() {
            local token="$1"
            local url="$2"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          runs_json="$(api_get "$UIP_TOKEN" "https://api.github.com/repos/dlockar1mtg/UniversalInvestmentPlatform/actions/workflows/metals-production-cycle.yml/runs?branch=main&status=success&per_page=30")"
          run_id="$(printf '%s' "$runs_json" | jq -r '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].id // empty')"
          test -n "$run_id" || { echo "No successful Metals production run found"; exit 1; }

          artifacts_json="$(api_get "$UIP_TOKEN" "https://api.github.com/repos/dlockar1mtg/UniversalInvestmentPlatform/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(printf '%s' "$artifacts_json" | jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("metals-production-")))][0].id // empty')"
          artifact_name="$(printf '%s' "$artifacts_json" | jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("metals-production-")))][0].name // empty')"
          test -n "$artifact_id" || { echo "No current Metals artifact found"; exit 1; }

          echo "METALS_SOURCE run_id=${run_id} artifact=${artifact_name}"
          api_get "$UIP_TOKEN" "https://api.github.com/repos/dlockar1mtg/UniversalInvestmentPlatform/actions/artifacts/${artifact_id}/zip" > incoming/metals.zip
          unzip -q incoming/metals.zip -d incoming/metals

      - name: Audit rich publication source contracts
        run: |
          python scripts/audit_rich_publication_source_contract.py \
            --metals-artifact incoming/metals \
            --mtg-repo source_repos/mtg \
            --evidence-output data/operations/publication/rich_source_contract_rehearsal.json

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-publication-contract-rehearsal-${{ github.run_id }}
          path: data/operations/publication/rich_source_contract_rehearsal.json
          if-no-files-found: warn
          retention-days: 30
