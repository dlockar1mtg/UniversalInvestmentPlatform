name: Crypto v2 prices

on:
  schedule:
    - cron: "15 0 * * *"   # daily, before the publication cycle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-v2-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch month-end closes from Kraken (merged with stored history)
        run: python scripts/fetch_crypto_monthly_closes.py
      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/crypto/crypto_monthly_closes.csv
          if git diff --cached --quiet; then echo "No price changes"; exit 0; fi
          git commit -m "Crypto month-end closes $(date -u +%F)"
          git push
