name: Crypto v2 prices

on:
  schedule:
    - cron: "15 0 * * *"   # daily, before the publication cycle
    - cron: "15 6 * * *" # backup: skipped unless the last run that did the work is over 12 hours old (see the gate job). One backup only: each gate run bills a full minute.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-v2-prices
  cancel-in-progress: false

jobs:
  gate:
    # GitHub often starts scheduled runs hours late or skips them, so this workflow also has
    # backup schedule times. A scheduled run goes ahead only if no run of this workflow finished
    # its work successfully in the last 12 hours. Manual and other runs always go ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          ALWAYS_RUN_SCHEDULES: ""
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ -n "$ALWAYS_RUN_SCHEDULES" ] && [[ "|$ALWAYS_RUN_SCHEDULES|" == *"|$SCHEDULE|"* ]]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf##*/}"
          since="$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_branch == \"main\" and .conclusion == \"success\") | select(.id != $GITHUB_RUN_ID) | select(.event == \"schedule\" or .event == \"workflow_dispatch\") | select(.run_started_at >= \"$since\") | .id")"
          for id in $ids; do
            worked="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
            if [ "$worked" -gt 0 ]; then
              echo "Run $id already did this workflow's work since $since, so this backup run stops here."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  prices:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }} # a failed gate never blocks the run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch month-end closes from Kraken (merged with stored history)
        run: python scripts/fetch_crypto_monthly_closes.py
      - name: Build projections, validate walk-forward, update the forecast log
        run: |
          pip install --quiet numpy
          python scripts/build_crypto_v2_projections.py
      - name: Commit prices, projections and forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto/crypto_monthly_closes.csv data/crypto/crypto_v2_projections.json data/crypto/crypto_v2_forecast_log.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Crypto v2 prices and projections $(date -u +%F)"
          git push
