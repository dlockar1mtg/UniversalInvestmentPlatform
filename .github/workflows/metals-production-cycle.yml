name: Metals Production Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * *"

permissions:
  contents: read

concurrency:
  group: uiip-metals-production-cycle
  cancel-in-progress: false

jobs:
  metals-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      UIIP_DATABASE_URL: ${{ secrets.UIIP_DATABASE_URL }}
      UIIP_FRED_API_KEY: ${{ secrets.UIIP_FRED_API_KEY }}
      UIIP_ALPHA_VANTAGE_API_KEY: ${{ secrets.UIIP_ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: >-
          pip install
          -r requirements.txt
          -r requirements/phase_7_3.txt
          -r requirements/metals_production.txt
      - name: Validate required secrets
        run: python -c "import os; assert os.environ.get('UIIP_DATABASE_URL')"
      - name: Collect vehicle metadata
        shell: bash
        run: |
          set +e
          candidate="$RUNNER_TEMP/vehicle_market_metadata_candidate.csv"
          python scripts/collect_metals_vehicle_metadata.py \
            --output "$candidate" \
            2>&1 | tee "$RUNNER_TEMP/metals_vehicle_metadata_collection.log"
          collection_status=${PIPESTATUS[0]}
          set -e

          if [ "$collection_status" -eq 0 ]; then
            cp "$candidate" config/metals/vehicle_market_metadata.csv
            echo "Complete Yahoo metadata candidate promoted to governed working path."
            exit 0
          fi

          if grep -Eq "YFRateLimitError|Too Many Requests|Rate limited" "$RUNNER_TEMP/metals_vehicle_metadata_collection.log"; then
            echo "Yahoo metadata collection was rate limited; validating existing governed metadata snapshot."
            python scripts/validate_metals_vehicle_metadata_fallback.py \
              --fallback-reason YAHOO_RATE_LIMIT
            exit 0
          fi

          if grep -q "METALS VEHICLE METADATA COLLECTION: PARTIAL" "$RUNNER_TEMP/metals_vehicle_metadata_collection.log"; then
            echo "Yahoo returned an incomplete metadata payload; validating existing governed metadata snapshot."
            python scripts/validate_metals_vehicle_metadata_fallback.py \
              --fallback-reason YAHOO_INCOMPLETE_METADATA_RESPONSE
            exit 0
          fi

          echo "Vehicle metadata collection failed for an unapproved reason."
          exit "$collection_status"
      - name: Collect official benchmark input
        run: python scripts/collect_metals_benchmark_input.py
      - name: Collect daily market input
        run: python scripts/collect_metals_daily_market_input.py
      - name: Ingest UIP-native observations
        run: >-
          python scripts/ingest_metals_native_observations.py
          --benchmark data/operations/metals/benchmark_input.csv
          --vehicle data/operations/metals/daily_market_input.csv
          --run-id "gha-${{ github.run_id }}"
          --strict
      - name: Run UIP-native forecasts
        run: python scripts/run_metals_native_cycle.py --strict
      - name: Build UIP-native rich history sidecars
        run: >-
          python scripts/build_metals_native_history_sidecars.py
          --output-root data/operations/metals/native_rich_history
      - name: Build UIP-native freshness V1 sidecar
        run: >-
          python scripts/build_metals_native_freshness_sidecar.py
          --benchmark data/operations/metals/benchmark_input.csv
          --daily-market data/operations/metals/daily_market_input.csv
          --contract config/presentation/metals_data_freshness_v1.json
          --output-root data/operations/metals/native_freshness_v1
      - name: Build UIP-native platform health V1 sidecar
        run: >-
          python scripts/build_metals_native_platform_health_sidecar.py
          --freshness data/operations/metals/native_freshness_v1/metals_data_freshness.csv
          --freshness-manifest data/operations/metals/native_freshness_v1/manifest.json
          --native-cycle data/operations/metals/native_cycle/latest.json
          --history-manifest data/operations/metals/native_rich_history/manifest.json
          --contract config/presentation/metals_platform_health_v1.json
          --output-root data/operations/metals/native_platform_health_v1
      - name: Build UIP-native model component V1 sidecar
        run: >-
          python scripts/build_metals_native_model_component_sidecar.py
          --native-cycle data/operations/metals/native_cycle/latest.json
          --contract config/presentation/metals_model_component_v1.json
          --output-root data/operations/metals/native_model_component_v1
      - name: Build UIP-native risk V1 sidecar
        run: >-
          python scripts/build_metals_native_risk_sidecar.py
          --history data/operations/metals/native_rich_history/metals_price_history.csv
          --history-manifest data/operations/metals/native_rich_history/manifest.json
          --contract config/presentation/metals_risk_v1.json
          --output-root data/operations/metals/native_risk_v1
      - name: Build UIP-native recommendation change V1 sidecar
        run: >-
          python scripts/build_metals_native_recommendation_change_sidecar.py
          --contract config/presentation/metals_recommendation_change_v1.json
          --methodology config/metals/model_methodology_registry.json
          --native-cycle data/operations/metals/native_cycle/latest.json
          --output-root data/operations/metals/native_recommendation_change_v1
      - name: Build UIP-native regime probability V1 sidecar
        run: >-
          python scripts/build_metals_native_regime_probability_sidecar.py
          --contract config/presentation/metals_regime_probability_v1.json
          --methodology config/metals/model_methodology_registry.json
          --native-cycle data/operations/metals/native_cycle/latest.json
          --output-root data/operations/metals/native_regime_probability_v1
      - name: Publish UIP-native package
        run: python scripts/publish_metals_uip_native_package.py --run-id "gha-${{ github.run_id }}" --strict
      - name: Resolve latest package root
        id: package
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("data/integration/metals/uip_native_packages/latest.json").read_text())
          print(f"path={payload['package_root']}")
          PY
      - name: Run standalone-free readiness
        run: python scripts/check_metals_native_readiness.py --package-root "${{ steps.package.outputs.path }}" --strict
      - name: Validate migration contract
        run: python scripts/check_metals_runtime_migration.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metals-production-${{ github.run_id }}
          path: |
            data/operations/metals/benchmark_input.csv
            data/operations/metals/daily_market_input.csv
            data/operations/metals/native_cycle/
            data/operations/metals/native_readiness/
            data/operations/metals/native_rich_history/
            data/operations/metals/native_freshness_v1/
            data/operations/metals/native_platform_health_v1/
            data/operations/metals/native_model_component_v1/
            data/operations/metals/native_risk_v1/
            data/operations/metals/native_recommendation_change_v1/
            data/operations/metals/native_regime_probability_v1/
            data/integration/metals/uip_native_packages/
          retention-days: 30
