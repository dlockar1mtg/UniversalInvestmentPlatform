name: Metals Native Source Inventory Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    env:
      UIIP_DATABASE_URL: ${{ secrets.UIIP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client dependency
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Validate required database secret
        run: python -c "import os; assert os.environ.get('UIIP_DATABASE_URL')"
      - name: Audit UIP-owned Metals source tables
        run: >-
          python scripts/audit_metals_native_source_inventory.py
          --output data/operations/publication/metals_native_source_inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: metals-native-source-inventory-${{ github.run_id }}
          path: data/operations/publication/metals_native_source_inventory.json
          retention-days: 30
