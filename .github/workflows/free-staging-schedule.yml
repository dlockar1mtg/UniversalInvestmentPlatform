name: Free Staging Scheduled Cycle
on:
  schedule:
    - cron: "17 13 * * *" # daily provider check (was every 6 hours)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uiip-free-staging-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      UIIP_ENVIRONMENT: staging
      UIIP_DATABASE_BACKEND: postgresql
      UIIP_JOB_DATABASE_BACKEND: postgresql
      UIIP_DATABASE_URL: ${{ secrets.UIIP_DATABASE_URL }}
      UIIP_ALPHA_VANTAGE_API_KEY: ${{ secrets.UIIP_ALPHA_VANTAGE_API_KEY }}
      UIIP_FRED_API_KEY: ${{ secrets.UIIP_FRED_API_KEY }}
      UIIP_SCHEDULES_JSON: '[{"schedule_id":"providers-6h","job_type":"provider_check","interval_seconds":21600,"payload":{}},{"schedule_id":"net-worth-daily","job_type":"net_worth_snapshot","interval_seconds":72000,"payload":{}}]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r requirements/phase_7_3.txt
      - name: Validate required secrets
        run: python -c "import os; assert all(os.environ.get(k) for k in ('UIIP_DATABASE_URL','UIIP_ALPHA_VANTAGE_API_KEY','UIIP_FRED_API_KEY'))"
      - name: Run bounded scheduled cycle
        run: python scripts/run_scheduled_cycle.py
