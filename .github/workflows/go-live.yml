name: Phase 7 Go-Live Gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Certified deployment target
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Type DEPLOY to authorize the gate
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  certify:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements/phase_7_3.txt
      - run: python -m pytest -q
      - run: python scripts/certify_phase_7.py | tee phase-7-certification.json
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file deployment/Dockerfile --tag uiip:phase-7-candidate .
      - uses: actions/upload-artifact@v4
        with:
          name: phase-7-${{ inputs.target }}-certification
          path: phase-7-certification.json
          if-no-files-found: error
          retention-days: 90
