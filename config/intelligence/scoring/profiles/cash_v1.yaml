  - {metric_name: diversification_score, dimension: diversification, strategy: bounded_range, weight: 1.0, parameters: {minimum: 0, maximum: 100, clip: true}}
  - {metric_name: macro_alignment, dimension: macro_alignment, strategy: bounded_range, weight: 1.0, parameters: {minimum: 0, maximum: 100, clip: true}}
  - {metric_name: data_confidence, dimension: data_confidence, strategy: bounded_range, weight: 1.0, parameters: {minimum: 0, maximum: 100, clip: true}}
